<!doctype html>
<html lang="es" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-eval'; style-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'"><title>Balisco</title><link rel="icon" href="logo.png" type="image/png"><link rel="stylesheet" href="styles.css?v=71"><script type="module" src="app.js?v=91"></script></head>
<body>
<div id="wallpaperBackdrop" aria-hidden="true"></div>
<header class="toolbar"><div id="searchBar" class="search-bar"><button id="searchToggle" class="icon-button" type="button" title="Buscar · Ctrl+F" aria-label="Buscar" aria-expanded="false" aria-controls="ghost"></button><input id="ghost" type="search" aria-label="Buscar en la biblioteca" aria-controls="tagSuggestions" title="Escribe @barra para mover la búsqueda arriba o abajo" placeholder="" autocomplete="off" spellcheck="false" hidden><div id="tagSuggestions" class="tag-suggestions" role="listbox" aria-label="Sugerencias de etiquetas y autores" hidden></div><div id="filters" class="filters" aria-label="Filtros activos"></div></div><nav id="dock" aria-label="Herramientas"></nav><input id="wallpaperFile" type="file" accept="image/jpeg,image/png,image/webp" hidden></header>
<main><section class="library">
<div id="viewport" tabindex="0" aria-label="Catálogo"><div id="canvas"></div><div id="empty" hidden></div></div><section id="metadataView" hidden aria-label="Metadatos"><div class="metadata-head"><div class="metadata-tabs"><button data-meta-tab="tag" aria-current="true">Etiquetas</button><button data-meta-tab="author">Autores</button></div><input id="metadataSearch" type="search" placeholder="Buscar metadatos…" aria-label="Buscar metadatos"></div><div id="metadataItems"></div></section><section id="courseView" hidden><div class="course-bar"><button id="back" class="icon-button" type="button" title="Volver a biblioteca" aria-label="Volver a biblioteca"></button><button id="folderBack" class="icon-button" type="button" title="Subir un nivel" aria-label="Subir un nivel" hidden></button><button id="explorer" class="icon-button" type="button" title="Abrir en Explorador de Windows" aria-label="Abrir en Explorador de Windows"></button><nav id="courseBreadcrumbs" class="course-breadcrumbs" aria-label="Ruta del contenedor"></nav></div><div class="table-head"><span>RECURSO</span><span>TAMAÑO</span></div><div id="resources"></div></section>
<span id="status" class="sr-only" role="status">Todo en su lugar</span></section>
<aside id="inspector" aria-label="Inspector"><div id="inspectorEmpty"><div class="empty-symbol"></div><h2>Un mundo por descubrir</h2><p>Selecciona una pieza de tu biblioteca para ver sus detalles.</p></div><div id="courseInspector" hidden></div><div id="details" hidden><div class="hero-wrap"><button id="hero" class="hero" title="Doble clic para abrir · clic derecho para cambiar portada" aria-label="Doble clic o Enter para abrir archivo; clic derecho o F2 para cambiar portada"><span id="heroArt"></span></button><span id="bulkNotice" class="bulk-notice" role="status" aria-live="polite"></span></div><input id="coverFile" type="file" accept="image/jpeg,image/png" hidden><label class="sr-only" for="title">Título</label><textarea id="title" class="inline-title" rows="1" spellcheck="false"></textarea><div class="field-label">NOTAS <span id="saveState" role="status"></span></div><textarea id="notes" placeholder="Ideas, conexiones, algo que recordar…" aria-label="Notas Markdown"></textarea><div class="drive-link"><span id="driveUrl"></span><button id="driveOpen" class="icon-button" title="Abrir en Google Drive" aria-label="Abrir en Google Drive"></button><button id="localOpen" class="icon-button" title="Mostrar en el Explorador de Windows" aria-label="Mostrar en el Explorador de Windows"></button></div><div class="field-label">ETIQUETAS</div><div id="itemTags"></div><form id="tagForm" hidden><input id="tagInput" placeholder="Nueva etiqueta" aria-label="Nueva etiqueta"><button class="text-button">Añadir</button></form><div class="field-label">AUTORES</div><div id="itemAuthors" aria-label="Autores del libro"></div><form id="authorForm" hidden><input id="authorInput" placeholder="Añadir autor" aria-label="Nombre del autor" autocomplete="off"><button class="text-button">Añadir</button></form><div class="properties"><div class="field-label">PROPIEDADES</div><div class="property"><span>Favorito</span><button id="itemFavorite" class="icon-button favorite-button" aria-label="Marcar como favorito" aria-pressed="false"></button></div><div class="property"><span>Calificación</span><div id="itemRating" class="stars"></div></div><div class="property"><span>Estado</span><select id="readingState" aria-label="Estado de lectura"><option value="pendiente">Pendiente</option><option value="interesado">Interesado</option><option value="leyendo">Leyendo</option><option value="leido">Leído</option><option value="abandonado">Abandonado</option></select></div><div id="properties"></div></div></div></aside></main>
<div id="popover" class="popover" hidden></div><section id="importPanel" class="import-panel" aria-label="Cargas" hidden></section><div id="toast" role="status" hidden></div><dialog id="dialog"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><form method="dialog"><button class="text-button">Cerrar</button></form></dialog>
</body></html>
